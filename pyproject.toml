[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-kinetix"
version = "1.0.0"
description = "Sovereign outside-in biomimetic kinematics and evolutionary behavioral hypervisor by Apex Growth Systems LLC"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Apex Growth Systems LLC", email = "engineering@apexgrowthsystems.com" }
]
keywords = [
    "biometric-evasion",
    "behavioral-biometrics",
    "neuromotor-kinematics",
    "minimum-jerk",
    "sigma-lognormal",
    "map-elites",
    "quality-diversity",
    "cma-es",
    "virtual-hid",
    "zero-cdp",
    "computer-use-agent",
    "cua",
    "frechet-distance",
    "fitts-law",
    "apex-growth-systems",
    "autonomous-agents",
    "stealth-automation",
    "cyber-kinetics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware :: Hardware Drivers"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AAH20/apex-kinetix"
Repository = "https://github.com/AAH20/apex-kinetix"
Documentation = "https://github.com/AAH20/apex-kinetix/tree/main/wiki"
